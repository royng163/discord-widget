name: Sync Discord WakaTime Widget

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
      DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
      DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      PROFILE_README_URL: ${{ vars.PROFILE_README_URL }}
      PROFILE_IMAGE_URL: ${{ vars.PROFILE_IMAGE_URL }}
      TITLE: ${{ vars.TITLE }}
      SUBTITLE_1: ${{ vars.SUBTITLE_1 }}
      SUBTITLE_2: ${{ vars.SUBTITLE_2 }}
      SUBTITLE_3: ${{ vars.SUBTITLE_3 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run sync
        run: python3 sync_widget.py
